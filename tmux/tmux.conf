#######################################
# Common settings
#######################################
set-option -g history-limit 5000
set -g base-index 1
set -g default-terminal "screen-256color"
set -s escape-time 0

# use VI
set-window-option -g mode-keys vi

# reload the config
unbind r
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

#######################################
# Window/Pane management
#######################################
unbind z
bind z last-window

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind C-x
bind C-x kill-pane

# split window (create pane)
# <space> split horizontally
# v split vertically
unbind %
bind Space split-window -v
bind v split-window -h
unbind =
bind = select-layout tiled

# resize pane
bind L resize-pane -R 8
bind H resize-pane -L 8
bind K resize-pane -U 4
bind J resize-pane -D 4

#######################################
# copy-paste remapping
#######################################
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

#######################################
# Status Bar (common)
#######################################
set -g status-interval 1
set -g status-right-length 60
set -g status-left-length 20

#######################################
# Nested session support
#
# Parent (outer): C-b prefix, blue status bar
#   Start with: tmux
#
# Child  (inner): C-a prefix, green status bar
#   Start with: tmux-inner
#
# Press F12 in outer to disable its keys so
# all input passes through to inner session.
#######################################

# Default: parent session
set-option -g prefix C-Space
bind C-Space send-prefix

set -g status-bg colour19
set -g status-fg white
set -g status-left '#[fg=white,bg=blue,bold] OUTER (C-Space) #[default] '
set -g window-status-current-style bg=colour21,fg=white,bold

# F12 toggles outer prefix off/on for nested usage
bind -T root F12 \
    set prefix None \;\
    set key-table off \;\
    set status-bg colour236 \;\
    set status-left '#[fg=colour244,bg=colour236] OUTER (off) #[default] ' \;\
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
    refresh-client -S

bind -T off F12 \
    set -u prefix \;\
    set -u key-table \;\
    set status-bg colour24 \;\
    set status-left '#[fg=white,bg=blue,bold] OUTER (C-Space) #[default] ' \;\
    refresh-client -S

# Override for child session
# Launched via: tmux-inner / txi function which sets TMUX_ROLE and TMUX_BG
# Each invocation uses a unique socket (-L nested-$RANDOM) so the config
# is re-read with a fresh random color.
if-shell '[ "$TMUX_ROLE" = "inner" ]' {
    set-option -g prefix C-a
    unbind C-Space
    bind C-a send-prefix

    set -g status-fg white
    run-shell 'tmux set -g status-bg "colour${TMUX_BG:-22}"'
    run-shell 'tmux set -g status-left "#[fg=white,bg=colour${TMUX_BG:-22},bold] INNER (C-a) #[default] "'
    run-shell 'tmux set -g window-status-current-style "bg=colour${TMUX_BG:-22},fg=white,bold"'

    # F12 toggle not needed in child
    unbind -T root F12
    unbind -T off F12
}
